name: Render Remotion Video

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remotion-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: remotion-build-${{ github.run_id }}-${{ github.run_attempt }}
      PROJECT_SLUG: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render videos
        run: |
          npm run build
          npm run build:loop

      - name: Render poster
        run: npm run poster

      - name: Stage release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          videos=(out/*.mp4 out/*.webm)
          if (( ${#videos[@]} == 0 )); then
            echo "error: npm run build produced no video files in out/" >&2
            exit 1
          fi

          mkdir -p artifacts
          for video in "${videos[@]}"; do
            name="$(basename "$video")"
            stem="${name%.*}"
            ext="${name##*.}"
            cp "$video" "artifacts/${PROJECT_SLUG}-${stem}-${RELEASE_TAG}.${ext}"
          done

          posters=(out/*.png)
          for poster in "${posters[@]}"; do
            name="$(basename "$poster")"
            stem="${name%.*}"
            ext="${name##*.}"
            cp "$poster" "artifacts/${PROJECT_SLUG}-${stem}-${RELEASE_TAG}.${ext}"
          done

      - name: Verify release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*)
          if (( ${#assets[@]} == 0 )); then
            echo "error: no release assets staged" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            test -s "$asset"
            bytes=$(stat -c%s "$asset")
            if (( bytes >= 2147483648 )); then
              echo "error: $asset exceeds GitHub's 2 GiB release asset limit" >&2
              exit 1
            fi
            echo "$asset: $bytes bytes"
          done

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --generate-notes
